<header>

<main>

  <section class="hero">

    <h1>
      Vip6s2000 Shop
    </h1>

    <p>
      Shop sản phẩm số — nhanh chóng và tiện lợi.
    </p>

  </section>


  <h2 style="margin-bottom:20px;">
    Sản phẩm
  </h2>


  <section id="products" class="products">

    <div class="empty">
      Đang tải sản phẩm...
    </div>

  </section>

</main>


<script>

const SUPABASE_URL =
  "https://kyylvrhjtcbscdjoyxwn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_vcDgsPLVCyzMNIygMVDVoQ_f8t71Fad";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ============================
// TÀI KHOẢN
// ============================

async function loadAccount() {

  const status =
    document.getElementById("accountStatus");


  const {
    data: { user },
    error
  } =
    await supabaseClient.auth.getUser();


  if (error || !user) {

    status.textContent =
      "Chưa đăng nhập";

    return;

  }


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient

      .from("profiles")

      .select("username, balance")

      .eq("id", user.id)

      .maybeSingle();


  if (profileError) {

    console.error(profileError);

    status.textContent =
      user.email;

    return;

  }


  const username =
    profile?.username ||
    user.email.split("@")[0];


  const balance =
    Number(profile?.balance || 0)
      .toLocaleString("vi-VN");


  status.textContent =
    username + " • " +
    balance + "đ";

}


// ============================
// SẢN PHẨM
// ============================

async function loadProducts() {

  const container =
    document.getElementById("products");


  const {
    data,
    error
  } =
    await supabaseClient

      .from("products")

      .select("*")

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    container.innerHTML = `

      <div class="empty">

        Lỗi tải sản phẩm:<br>

        ${error.message}

      </div>

    `;

    console.error(error);

    return;

  }


  if (!data || data.length === 0) {

    container.innerHTML = `

      <div class="empty">

        Shop chưa có sản phẩm.

      </div>

    `;

    return;

  }


  container.innerHTML =

    data.map(product => `

      <div class="product">

        <img
          src="${
            product.image_url ||
            "https://via.placeholder.com/500x350?text=Product"
          }"
          alt="${product.name}"
        >

        <div class="product-info">

          <h3>
            ${product.name}
          </h3>

          <div class="description">

            ${
              product.description ||
              "Chưa có mô tả"
            }

          </div>

          <div class="price">

            ${
              Number(product.price)
                .toLocaleString("vi-VN")
            }đ

          </div>

          <button
            class="buy-button"
            onclick="buyProduct('${product.id}')"
          >
            Mua ngay
          </button>

        </div>

      </div>

    `).join("");

}


// ============================
// MUA HÀNG
// ============================

async function buyProduct(productId) {

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    alert(
      "Bạn cần đăng nhập trước khi mua hàng."
    );

    window.location.href =
      "account.html";

    return;

  }


  const confirmed =
    confirm(
      "Bạn có chắc muốn mua sản phẩm này?"
    );


  if (!confirmed) {
    return;
  }


  const buttons =
    document.querySelectorAll(".buy-button");


  buttons.forEach(button => {
    button.disabled = true;
  });


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "buy_product",
      {
        p_product_id: productId
      }
    );


  buttons.forEach(button => {
    button.disabled = false;
  });


  if (error) {

    console.error(error);

    alert(
      "Không thể mua hàng:\n" +
      error.message
    );

    return;

  }


  if (!data || !data.success) {

    alert(
      data?.message ||
      "Mua hàng thất bại."
    );

    return;

  }


  alert(
    "✅ " +
    data.message
  );


  // Cập nhật số dư

  await loadAccount();

  // Cập nhật tồn kho

  await loadProducts();

}


// ============================
// KHỞI ĐỘNG
// ============================

async function startShop() {

  await loadAccount();

  await loadProducts();

}


startShop();

</script>

</body>
</html>
