<script>

const SUPABASE_URL =
  "https://kyylvrhjtcbscdjoyxwn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_vcDgsPLVCyzMNIygMVDVoQ_f8t71Fad";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ============================
// TẢI TÀI KHOẢN
// ============================

async function loadAccount() {

  const {
    data: { user },
    error
  } =
    await supabaseClient.auth.getUser();


  if (error || !user) {

    window.location.href =
      "./index.html";

    return;

  }


  document.getElementById("email")
    .textContent =
      user.email || "Không có";


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient

      .from("profiles")

      .select("username, balance")

      .eq("id", user.id)

      .maybeSingle();


  if (profileError) {

    console.error(profileError);

    document.getElementById("username")
      .textContent =
        user.email.split("@")[0];

    document.getElementById("balance")
      .textContent =
        "0đ";

    return;

  }


  const username =
    profile?.username ||
    user.email.split("@")[0];


  const balance =
    Number(profile?.balance || 0)
      .toLocaleString("vi-VN");


  document.getElementById("username")
    .textContent =
      username;


  document.getElementById("balance")
    .textContent =
      balance + "đ";


  loadOrders(user.id);

}


// ============================
// LỊCH SỬ ĐƠN HÀNG
// ============================

async function loadOrders(userId) {

  const container =
    document.getElementById("orders");


  const {
    data,
    error
  } =
    await supabaseClient

      .from("orders")

      .select("*")

      .eq("user_id", userId)

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    container.innerHTML = `

      <div class="empty">

        Chưa có đơn hàng.

      </div>

    `;

    return;

  }


  if (!data || data.length === 0) {

    container.innerHTML = `

      <div class="empty">

        Bạn chưa mua sản phẩm nào.

      </div>

    `;

    return;

  }


  container.innerHTML =

    data.map(order => `

      <div class="order">

        <div class="order-name">

          ${
            order.product_name ||
            "Sản phẩm"
          }

        </div>

        <div class="order-info">

          Giá:

          ${
            Number(order.price || 0)
              .toLocaleString("vi-VN")
          }đ

          <br>

          Thời gian:

          ${
            order.created_at
              ? new Date(
                  order.created_at
                ).toLocaleString("vi-VN")
              : "Không rõ"
          }

        </div>

      </div>

    `).join("");

}


// ============================
// ĐĂNG XUẤT
// ============================

async function logout() {

  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if (error) {

    alert(
      "Không thể đăng xuất: " +
      error.message
    );

    return;

  }


  window.location.href =
    "./index.html";

}


// ============================
// KHỞI ĐỘNG
// ============================

loadAccount();

</script>
