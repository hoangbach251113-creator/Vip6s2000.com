<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vip6s2000 Shop - Tài khoản</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f5f7fb;
  color: #202633;
}

/* SIDEBAR */

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;

  width: 240px;

  background: white;
  border-right: 1px solid #e7eaf0;

  padding: 20px 14px;

  overflow-y: auto;
}

.logo {
  display: block;

  padding: 15px 12px 25px;

  font-size: 21px;
  font-weight: bold;

  color: #2563eb;

  text-decoration: none;
}

.menu-title {
  font-size: 11px;
  color: #9aa1ad;

  margin: 18px 10px 8px;

  text-transform: uppercase;
}

.menu a {
  display: flex;
  align-items: center;

  gap: 12px;

  padding: 11px 13px;

  margin-bottom: 4px;

  border-radius: 9px;

  text-decoration: none;

  color: #4b5563;

  font-size: 14px;
}

.menu a:hover {
  background: #f0f4ff;
  color: #2563eb;
}

.menu a.active {
  background: #eaf1ff;
  color: #2563eb;
  font-weight: bold;
}

/* MAIN */

.main {
  margin-left: 240px;

  min-height: 100vh;
}

/* TOPBAR */

.topbar {
  height: 65px;

  background: white;

  border-bottom: 1px solid #e7eaf0;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 30px;
}

.page-title {
  font-size: 18px;
  font-weight: bold;
}

.user-mini {
  background: #f3f6fb;

  padding: 9px 14px;

  border-radius: 9px;

  font-size: 13px;
}

/* CONTENT */

.content {
  padding: 30px;

  max-width: 1200px;

  margin: auto;
}

/* CARDS */

.card {
  background: white;

  border: 1px solid #e6e9ef;

  border-radius: 13px;

  padding: 22px;

  margin-bottom: 20px;

  box-shadow: 0 2px 8px rgba(0,0,0,.03);
}

.card-title {
  font-size: 17px;

  font-weight: bold;

  margin-bottom: 18px;
}

/* STATS */

.stats {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 18px;

  margin-bottom: 20px;
}

.stat {
  background: white;

  border: 1px solid #e6e9ef;

  border-radius: 13px;

  padding: 20px;

  box-shadow: 0 2px 8px rgba(0,0,0,.03);
}

.stat-label {
  color: #8b94a3;

  font-size: 13px;

  margin-bottom: 10px;
}

.stat-value {
  font-size: 25px;

  font-weight: bold;

  color: #2563eb;
}

/* ACCOUNT */

.account-grid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 15px;
}

.info-box {
  background: #f7f9fc;

  border-radius: 10px;

  padding: 15px;
}

.info-label {
  font-size: 12px;

  color: #8b94a3;

  margin-bottom: 6px;
}

.info-value {
  font-size: 15px;

  font-weight: 600;

  word-break: break-all;
}

/* TOPUP */

.topup-layout {
  display: grid;

  grid-template-columns:
    330px 1fr;

  gap: 35px;

  align-items: center;
}

.qr-area {
  text-align: center;
}

.qr-area img {
  width: 280px;

  height: 280px;

  object-fit: contain;

  padding: 10px;

  background: white;

  border: 1px solid #e1e5eb;

  border-radius: 12px;
}

.qr-text {
  margin-top: 12px;

  color: #8b94a3;

  font-size: 13px;
}

/* FORM */

.form {
  display: grid;

  gap: 15px;
}

.form-group {
  display: grid;

  gap: 7px;
}

.form-group label {
  font-size: 13px;

  font-weight: bold;
}

.form-group input,
.form-group textarea {
  width: 100%;

  padding: 13px;

  border: 1px solid #dfe4ec;

  border-radius: 9px;

  background: #fafbfc;

  outline: none;

  font-size: 14px;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: #2563eb;

  background: white;
}

.form-group textarea {
  min-height: 90px;

  resize: vertical;
}

.btn {
  border: none;

  border-radius: 9px;

  padding: 13px;

  background: #2563eb;

  color: white;

  font-weight: bold;

  cursor: pointer;
}

.btn:hover {
  opacity: .9;
}

.btn:disabled {
  opacity: .5;
}

/* LIST */

.list {
  display: grid;

  gap: 10px;
}

.item {
  background: #f7f9fc;

  border-radius: 10px;

  padding: 15px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;
}

.item-title {
  font-weight: bold;

  margin-bottom: 5px;
}

.item-info {
  color: #8b94a3;

  font-size: 13px;

  line-height: 1.6;
}

.status {
  padding: 6px 10px;

  border-radius: 7px;

  font-size: 11px;

  font-weight: bold;

  white-space: nowrap;
}

.pending {
  background: #fff4d6;

  color: #a36a00;
}

.approved {
  background: #dff7e8;

  color: #168347;
}

.rejected {
  background: #ffe1e5;

  color: #c53648;
}

.empty {
  text-align: center;

  padding: 25px;

  color: #8b94a3;
}

/* LOGOUT */

.logout {
  width: 100%;

  border: none;

  background: #fff0f1;

  color: #d33b4b;

  padding: 11px;

  border-radius: 9px;

  cursor: pointer;

  font-weight: bold;

  margin-top: 15px;
}

/* MOBILE */

@media(max-width: 800px) {

  .sidebar {
    width: 190px;
  }

  .main {
    margin-left: 190px;
  }

  .topup-layout {
    grid-template-columns: 1fr;
  }

  .qr-area img {
    width: 240px;
    height: 240px;
  }

  .stats {
    grid-template-columns: 1fr;
  }

}

@media(max-width: 600px) {

  .sidebar {
    position: static;

    width: 100%;

    height: auto;

    border-right: none;

    border-bottom: 1px solid #e7eaf0;
  }

  .main {
    margin-left: 0;
  }

  .menu {
    display: flex;

    overflow-x: auto;
  }

  .menu-title {
    display: none;
  }

  .menu a {
    white-space: nowrap;
  }

  .content {
    padding: 15px;
  }

  .account-grid {
    grid-template-columns: 1fr;
  }

  .topbar {
    padding: 0 15px;
  }

}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

  <a href="./index.html" class="logo">
    Vip6s2000 Shop
  </a>

  <div class="menu-title">
    MENU
  </div>

  <nav class="menu">

    <a href="./index.html">
      🏠 Trang chủ
    </a>

    <a href="#topup">
      💰 Nạp tiền
    </a>

    <a href="#orders">
      🛒 Đơn hàng
    </a>

    <a href="#account" class="active">
      👤 Tài khoản
    </a>

  </nav>

</aside>


<!-- MAIN -->

<div class="main">

  <!-- TOPBAR -->

  <header class="topbar">

    <div class="page-title">
      Tài khoản
    </div>

    <div
      class="user-mini"
      id="userMini"
    >
      Đang tải...
    </div>

  </header>


  <!-- CONTENT -->

  <main class="content">


    <!-- STATS -->

    <section class="stats">

      <div class="stat">

        <div class="stat-label">
          Số dư
        </div>

        <div
          class="stat-value"
          id="balance"
        >
          0đ
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Trạng thái
        </div>

        <div class="stat-value">
          Hoạt động
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Tài khoản
        </div>

        <div
          class="stat-value"
          id="username"
        >
          ...
        </div>

      </div>

    </section>


    <!-- ACCOUNT -->

    <section
      class="card"
      id="account"
    >

      <div class="card-title">
        👤 Thông tin tài khoản
      </div>


      <div class="account-grid">

        <div class="info-box">

          <div class="info-label">
            Tên tài khoản
          </div>

          <div
            class="info-value"
            id="accountUsername"
          >
            Đang tải...
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            Email
          </div>

          <div
            class="info-value"
            id="email"
          >
            Đang tải...
          </div>

        </div>

      </div>

    </section>


    <!-- TOPUP -->

    <section
      class="card"
      id="topup"
    >

      <div class="card-title">
        💰 Nạp tiền
      </div>


      <div class="topup-layout">


        <!-- QR -->

        <div class="qr-area">

          <img
            src="https://i.postimg.cc/wBX4sDtd/1787827694385-696929691253049774-8699560983222085822-94543adeb257cbe2ab14e39c8e798af6.jpg"
            alt="QR nạp tiền"
          >

          <div class="qr-text">
            Quét QR để chuyển khoản
          </div>

        </div>


        <!-- FORM -->

        <div class="form">


          <div class="form-group">

            <label>
              💰 Số tiền
            </label>

            <input
              id="topupAmount"
              type="number"
              min="1"
              placeholder="Nhập số tiền"
            >

          </div>


          <div class="form-group">

            <label>
              📝 Nội dung chuyển khoản
            </label>

            <textarea
              id="topupNote"
              placeholder="Nhập nội dung chuyển khoản"
            ></textarea>

          </div>


          <button
            class="btn"
            id="topupButton"
            onclick="createTopup()"
          >
            ✓ Tôi đã chuyển khoản
          </button>

        </div>

      </div>

    </section>


    <!-- TOPUP HISTORY -->

    <section class="card">

      <div class="card-title">
        📋 Lịch sử nạp tiền
      </div>

      <div
        class="list"
        id="topups"
      >

        <div class="empty">
          Đang tải...
        </div>

      </div>

    </section>


    <!-- ORDERS -->

    <section
      class="card"
      id="orders"
    >

      <div class="card-title">
        🛒 Đơn hàng của tôi
      </div>

      <div
        class="list"
        id="ordersList"
      >

        <div class="empty">
          Đang tải...
        </div>

      </div>

    </section>


    <!-- LOGOUT -->

    <section class="card">

      <button
        class="logout"
        onclick="logout()"
      >
        Đăng xuất
      </button>

    </section>


  </main>

</div>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
  "https://kyylvrhjtcbscdjoyxwn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_vcDgsPLVCyzMNIygMVDVoQ_f8t71Fad";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =================================
   FORMAT
================================= */

function money(value) {

  return Number(value || 0)
    .toLocaleString("vi-VN") + "đ";

}

function dateFormat(value) {

  if (!value) return "Không rõ";

  return new Date(value)
    .toLocaleString("vi-VN");

}


/* =================================
   ACCOUNT
================================= */

async function loadAccount() {

  const {
    data: { user },
    error
  } =
    await supabaseClient.auth.getUser();


  if (error || !user) {

    window.location.href =
      "./index.html";

    return null;

  }


  document.getElementById("email")
    .textContent =
    user.email || "Không có";


  document.getElementById("userMini")
    .textContent =
    user.email || "Tài khoản";


  const {
    data: profile
  } =
    await supabaseClient
      .from("profiles")
      .select("username,balance")
      .eq("id", user.id)
      .maybeSingle();


  const name =
    profile?.username ||
    user.email.split("@")[0];


  const balance =
    profile?.balance || 0;


  document.getElementById("username")
    .textContent = name;


  document.getElementById("accountUsername")
    .textContent = name;


  document.getElementById("balance")
    .textContent = money(balance);


  return user;

}


/* =================================
   TOPUP
================================= */

async function createTopup() {

  const amount =
    Number(
      document.getElementById(
        "topupAmount"
      ).value
    );


  const note =
    document.getElementById(
      "topupNote"
    ).value.trim();


  const button =
    document.getElementById(
      "topupButton"
    );


  if (!amount || amount <= 0) {

    alert(
      "Vui lòng nhập số tiền hợp lệ."
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "Đang gửi...";


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "create_topup_request",
      {
        p_amount: amount,
        p_note: note || null
      }
    );


  button.disabled = false;

  button.textContent =
    "✓ Tôi đã chuyển khoản";


  if (error) {

    alert(
      "Lỗi: " + error.message
    );

    return;

  }


  if (!data?.success) {

    alert(
      data?.message ||
      "Không thể gửi yêu cầu."
    );

    return;

  }


  alert(
    "✅ Đã gửi yêu cầu nạp tiền!"
  );


  document.getElementById(
    "topupAmount"
  ).value = "";


  document.getElementById(
    "topupNote"
  ).value = "";


  loadTopups();

}


/* =================================
   TOPUP HISTORY
================================= */

async function loadTopups() {

  const container =
    document.getElementById(
      "topups"
    );


  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if (!user) return;


  const {
    data,
    error
  } =
    await supabaseClient

      .from("topup_requests")

      .select(
        "id,amount,status,note,created_at,processed_at"
      )

      .eq(
        "user_id",
        user.id
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error || !data?.length) {

    container.innerHTML = `
      <div class="empty">
        Chưa có yêu cầu nạp tiền.
      </div>
    `;

    return;

  }


  container.innerHTML =
    data.map(item => {

      let text =
        "Đang chờ";

      let cls =
        "pending";


      if (item.status === "approved") {

        text =
          "Đã duyệt";

        cls =
          "approved";

      }


      if (item.status === "rejected") {

        text =
          "Từ chối";

        cls =
          "rejected";

      }


      return `

        <div class="item">

          <div>

            <div class="item-title">
              ${money(item.amount)}
            </div>

            <div class="item-info">

              ${dateFormat(item.created_at)}

              ${
                item.note
                ? `<br>Nội dung: ${item.note}`
                : ""
              }

            </div>

          </div>

          <span class="status ${cls}">
            ${text}
          </span>

        </div>

      `;

    }).join("");

}


/* =================================
   ORDERS
================================= */

async function loadOrders() {

  const container =
    document.getElementById(
      "ordersList"
    );


  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if (!user) return;


  const {
    data,
    error
  } =
    await supabaseClient

      .from("orders")

      .select("*")

      .eq(
        "user_id",
        user.id
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error || !data?.length) {

    container.innerHTML = `
      <div class="empty">
        Bạn chưa có đơn hàng.
      </div>
    `;

    return;

  }


  container.innerHTML =
    data.map(order => `

      <div class="item">

        <div>

          <div class="item-title">
            ${order.product_name || "Sản phẩm"}
          </div>

          <div class="item-info">

            Giá:
            ${money(order.price)}

            <br>

            ${dateFormat(order.created_at)}

          </div>

        </div>

      </div>

    `).join("");

}


/* =================================
   LOGOUT
================================= */

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "./index.html";

}


/* =================================
   START
================================= */

async function start() {

  const user =
    await loadAccount();

  if (!user) return;

  await loadTopups();

  await loadOrders();

}

start();

</script>

</body>
</html>
