<!-- ==========================
     NẠP TIỀN
=========================== -->

<section class="card topup-card">

  <h2 class="topup-title">
    💰 Nạp tiền
  </h2>

  <p class="topup-subtitle">
    Quét mã QR bên dưới để chuyển khoản
  </p>


  <!-- QR -->

  <div class="qr-container">

    <div class="qr-frame">

      <img
        src="https://i.postimg.cc/wBX4sDtd/1787827694385-696929691253049774-8699560983222085822-94543adeb257cbe2ab14e39c8e798af6.jpg"
        alt="QR nạp tiền"
      >

    </div>

  </div>


  <div class="qr-hint">
    Sau khi chuyển khoản thành công,
    nhập thông tin bên dưới.
  </div>


  <!-- FORM -->

  <div class="topup-form">


    <div class="input-group">

      <label for="topupAmount">
        💰 Số tiền
      </label>

      <input
        id="topupAmount"
        type="number"
        min="1"
        placeholder="Ví dụ: 100000"
      >

    </div>


    <div class="input-group">

      <label for="topupNote">
        📝 Nội dung chuyển khoản
      </label>

      <textarea
        id="topupNote"
        placeholder="Nhập nội dung chuyển khoản..."
      ></textarea>

    </div>


    <button
      class="topup-button"
      id="topupButton"
      onclick="createTopup()"
    >
      ✓ Tôi đã chuyển khoản
    </button>

  </div>

</section>

Thêm CSS này vào trong `<style>` của `account.html`:

```css
/* ==========================
   GIAO DIỆN NẠP TIỀN
========================== */

.topup-card {
  text-align: center;
}

.topup-title {
  font-size: 24px;
  margin-bottom: 8px;
}

.topup-subtitle {
  color: #9da5b5;
  font-size: 14px;
  margin-bottom: 25px;
}


/* QR */

.qr-container {
  display: flex;
  justify-content: center;
  align-items: center;
}

.qr-frame {
  background: white;
  padding: 12px;
  border-radius: 18px;

  box-shadow:
    0 10px 35px rgba(0, 0, 0, 0.35);
}

.qr-frame img {
  display: block;

  width: 280px;
  height: 280px;

  max-width: 100%;

  object-fit: contain;

  border-radius: 10px;
}


.qr-hint {
  color: #8f97a8;

  font-size: 13px;

  margin: 15px 0 25px;

  line-height: 1.5;
}


/* FORM */

.topup-form {
  max-width: 500px;

  margin: 0 auto;

  text-align: left;

  display: grid;

  gap: 16px;
}


.input-group {
  display: grid;

  gap: 7px;
}


.input-group label {
  color: #dce1ea;

  font-size: 14px;

  font-weight: bold;
}


.input-group input,
.input-group textarea {

  width: 100%;

  padding: 14px;

  background: #202633;

  color: white;

  border: 1px solid #343b4a;

  border-radius: 11px;

  outline: none;

  font-size: 15px;

  transition: .2s;
}


.input-group input:focus,
.input-group textarea:focus {
  border-color: #7d8799;

  box-shadow:
    0 0 0 3px rgba(125, 135, 153, .12);
}


.input-group textarea {
  min-height: 90px;

  resize: vertical;
}


/* BUTTON */

.topup-button {

  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 11px;

  background: white;

  color: #111;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

  transition: .2s;
}


.topup-button:hover {
  transform: translateY(-1px);

  opacity: .9;
}


.topup-button:disabled {
  opacity: .5;

  cursor: not-allowed;

  transform: none;
}


/* MOBILE */

@media (max-width: 600px) {

  .qr-frame img {
    width: 230px;

    height: 230px;
  }

  .topup-title {
    font-size: 22px;
  }

}
```
